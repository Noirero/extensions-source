name: Test build extension

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Extension module path (example: src/id/doujindesu)"
        required: true
        default: "src/id/doujindesu"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate module input
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          if [[ ! "$MODULE" =~ ^src/[a-z0-9_-]+/[a-z0-9_-]+$ ]]; then
            echo "Invalid module path: $MODULE"
            exit 1
          fi
          if [[ ! -f "$MODULE/build.gradle.kts" ]]; then
            echo "Module does not exist: $MODULE"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build release APK
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          GRADLE_MODULE=":${MODULE//\//:}"
          ./gradlew "${GRADLE_MODULE}:assembleRelease" "${GRADLE_MODULE}:lintRelease"

      - name: Upload test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-apk-${{ github.run_number }}
          path: |
            ${{ inputs.module }}/build/outputs/apk/release/*.apk
            ${{ inputs.module }}/build/outputs/jar/release/*.jar
          if-no-files-found: error
          retention-days: 7
